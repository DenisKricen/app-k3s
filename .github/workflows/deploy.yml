name: Deploy to AWS (Kubernetes)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/orcastration-wordpress
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update image version in Kubernetes manifests
        run: |
          sed -i "s|denysdock/devops-app:latest|${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g" k8s/app-deploy.yml

      - name: Copy Kubernetes manifests and Nginx config to AWS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "k8s/,nginx/"
          target: "~/deploy-wordpress"

      - name: Deploy on AWS and configure Nginx + SSL
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          envs: DOMAIN,EMAIL
          script: |
            set -e
            export KUBECONFIG=~/.kube/config

            # Force permissions on kubeconfig just in case
            sudo chown ubuntu:ubuntu ~/.kube/config
            sudo chmod 600 ~/.kube/config

            # Enable kubernetes manifests
            cd ~/deploy-wordpress
            kubectl apply -f k8s/ --validate=false
            
            # Wait for pods to launch
            kubectl wait deployment/devops-app --for condition=Available=True --timeout=120s || true

            # Create challenge directory and set permissions
            sudo mkdir -p /var/www/html/.well-known/acme-challenge
            sudo chown -R www-data:www-data /var/www/html

            # Enabling nginx configuration
            sudo cp ~/deploy-wordpress/nginx/site.conf /etc/nginx/sites-available/$DOMAIN

            # Activate config
            sudo ln -sf /etc/nginx/sites-available/$DOMAIN /etc/nginx/sites-enabled/
            sudo nginx -t

            # Start nginx if not running, otherwise reload
            if ! systemctl is-active --quiet nginx; then
              sudo systemctl start nginx
            else
              sudo systemctl reload nginx
            fi

            